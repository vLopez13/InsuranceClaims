name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: devrootpassword
          MYSQL_DATABASE: insurance_claims_test
          MYSQL_USER: claims
          MYSQL_PASSWORD: devpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdevrootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_DATABASE_URL: mysql+pymysql://claims:devpassword@127.0.0.1:3306/insurance_claims_test?charset=utf8mb4
      MYSQL_ADMIN_URL: mysql+pymysql://root:devrootpassword@127.0.0.1:3306/mysql?charset=utf8mb4
      TEST_API_KEY: test-api-key
      APPROVE_T: "0.80"
      HIGH_AMOUNT_T: "70000.00"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest
